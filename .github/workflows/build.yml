
name: Build PaperDollTouch

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang zip unzip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "ndk;27.2.12479018"
          yes | sdkmanager --licenses

      - name: Extract uploaded source ZIP
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' ! -path './.git/*' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP tidak ditemukan di repository."
            exit 1
          fi
          mkdir -p source
          unzip -o "$ZIP_FILE" -d source
          find source -maxdepth 4 -type f | head -200

      - name: Locate CMake project
        id: project
        run: |
          set -euo pipefail
          CMAKE_FILE="$(find source -type f -name CMakeLists.txt | head -n 1)"
          if [ -z "$CMAKE_FILE" ]; then
            echo "ERROR: CMakeLists.txt tidak ditemukan dalam source ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$CMAKE_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          sed -i 's/-fno-exceptions//g' "$CMAKE_FILE"

      - name: Build ARM64
        run: |
          set -euo pipefail
          cmake -S "${{ steps.project.outputs.project_dir }}" -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26
          cmake --build build --parallel 2

      - name: Collect build outputs
        run: |
          set -euo pipefail
          mkdir -p dist
          find build source -type f \( -name '*.so' -o -name '*.levipack' \) -exec cp -v {} dist/ \;
          if ! find dist -type f | grep -q .; then
            echo "ERROR: Tidak ada file .so atau .levipack yang dihasilkan."
            exit 1
          fi
          cd dist
          zip -r ../PaperDollTouch-ARM64.zip .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PaperDollTouch-ARM64
          path: PaperDollTouch-ARM64.zip
          if-no-files-found: error

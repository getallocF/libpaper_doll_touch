name: Build PaperDollTouch Android ARM64

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake packages
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Get official LeviLauncher native mod SDK
        run: git clone --depth 1 --branch 0.2.3 https://github.com/LiteLDev/preloader-android.git sdk/preloader-android

      - name: Configure for Android arm64-v8a
        run: >-
          cmake -S . -B build/arm64-v8a -G Ninja
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-28
          -DCMAKE_BUILD_TYPE=Release
          -DPRELOADER_SDK_DIR="$GITHUB_WORKSPACE/sdk/preloader-android"

      - name: Compile native library
        run: cmake --build build/arm64-v8a --target paper_doll_touch --parallel 2

      - name: Package .so and .levipack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package/config
          cp build/arm64-v8a/libpaper_doll_touch.so dist/libpaper_doll_touch.so
          cp build/arm64-v8a/libpaper_doll_touch.so dist/package/libpaper_doll_touch.so
          cp manifest.json dist/package/manifest.json
          cp config/config.json dist/package/config/config.json
          cp config/config.schema.json dist/package/config/config.schema.json
          (cd dist/package && zip -qr ../PaperDollTouch.levipack .)

      - name: Verify architecture and package layout
        shell: bash
        run: |
          set -euo pipefail
          file dist/libpaper_doll_touch.so
          readelf -h dist/libpaper_doll_touch.so | tee dist/readelf-header.txt
          readelf -h dist/libpaper_doll_touch.so | grep -q 'AArch64'
          unzip -l dist/PaperDollTouch.levipack | tee dist/package-list.txt
          unzip -l dist/PaperDollTouch.levipack | grep -q 'manifest.json'
          unzip -l dist/PaperDollTouch.levipack | grep -q 'libpaper_doll_touch.so'
          echo 'WARNING: safe diagnostic build only. Interactive behavior is not verified while verifiedSignaturesReady=false.' | tee dist/IMPORTANT.txt

      - name: Upload build results
        uses: actions/upload-artifact@v4
        with:
          name: PaperDollTouch-Android-arm64v8a
          path: dist/*
          if-no-files-found: error
